:root{
  --ink:#e9e9e9;
  --ink-dim:#9a9a9a;
  --ink-faint:#6a6a6a;
  --line:#3a3a3a;
  --line-soft:#2a2a2a;
  --panel-3:#101010;
  --bg:#050505;
  --knob:#f2f2f2;
  --axis:#4a4a4a;
}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{height:100%;background:#000;color:var(--ink);font-family:'Cinzel',serif;overflow:hidden;}

#stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
#scaler{width:640px;height:480px;transform-origin:center center;}

#sheet{
  width:640px;height:480px;position:relative;
  background:linear-gradient(135deg,#101010 0%,#070707 60%,#0d0d0d 100%);
  border:1px solid var(--line);
  box-shadow:0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.7);
  overflow:hidden;
}

/* ---- portrait ---- */
#portrait{
  position:absolute;top:0;right:0;bottom:0;width:55%;
  background-position:center center;background-repeat:no-repeat;background-size:cover;
  z-index:0;pointer-events:none;
  /* fade dropped for experiment */
  /* -webkit-mask-image:linear-gradient(to right, transparent 18%, #000 42%);
          mask-image:linear-gradient(to right, transparent 18%, #000 42%); */
}
#portrait.empty{background:repeating-linear-gradient(45deg,#0e0e0e,#0e0e0e 12px,#111 12px,#111 24px);}
#portrait::after{
  content:"";position:absolute;inset:0;
  /* vignette dropped for experiment */
  /* background:radial-gradient(120% 120% at 100% 50%, transparent 45%, rgba(0,0,0,.30) 100%); */
  pointer-events:none;
}
/* dark panel behind the left content; opaque up to the content edge, then fades out to the right over ~5% */
#scrim{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg, #0a0a0a 0%, #0a0a0a 50%, transparent 55%);
}

/* ================= HEADER ================= */
#header{
  position:absolute;top:0;left:0;right:0;height:52px;z-index:3;
  display:flex;flex-direction:column;justify-content:center;padding:5px 16px;
}
#header .hdr-bg{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg, rgba(0,0,0,.90), rgba(0,0,0,.40));
  -webkit-mask-image:linear-gradient(to right, #000 25%, transparent 50%);
          mask-image:linear-gradient(to right, #000 25%, transparent 50%);
}
#header .hdr-line{
  position:absolute;left:0;right:0;bottom:0;height:1px;
  background:linear-gradient(to right, var(--line) 25%, transparent 50%);
}
#name{
  width:100%;background:transparent;border:none;color:var(--ink);
  font-family:inherit;font-weight:700;font-size:22px;letter-spacing:2px;
  outline:none;text-transform:uppercase;line-height:1;text-shadow:0 2px 8px #000;
}
#name::placeholder{color:var(--ink-faint);}
#epithet{
  width:100%;background:transparent;border:none;color:var(--ink-dim);
  font-family:inherit;font-weight:400;font-size:10px;letter-spacing:4px;
  outline:none;text-transform:uppercase;margin-top:3px;
}
#epithet::placeholder{color:var(--ink-faint);}

/* ================= LEFT COLUMN ================= */
#leftcol{
  position:absolute;top:52px;left:0;width:305px;z-index:2;
  padding:2px 0 0 10px;display:flex;flex-direction:column;
}
.section-label{
  font-size:7.5px;letter-spacing:4px;color:var(--ink-faint);
  text-transform:uppercase;border-bottom:1px solid var(--line-soft);
  padding-bottom:3px;
}

/* top row: diamond beside affinities */
#toprow{display:flex;align-items:stretch;gap:2px;}
#natureblock{display:flex;flex-direction:column;gap:3px;flex:0 0 auto;}
#diamond{width:108px;height:98px;display:block;align-self:center;}
#diamond text.axis-label{
  font-family:'Cinzel',serif;font-size:6.5px;fill:var(--ink-dim);
  letter-spacing:.3px;text-transform:uppercase;font-weight:700;
}
#diamond .axis{stroke:var(--axis);stroke-width:1;}
#diamond .ring{stroke:var(--line-soft);stroke-width:1;fill:none;}
#diamond .fill{fill:rgba(230,230,230,.14);stroke:#e6e6e6;stroke-width:1.5;}
.knob{fill:var(--knob);stroke:#000;stroke-width:1;cursor:grab;}
.knob:active{cursor:grabbing;}
.knob-hit{fill:transparent;cursor:pointer;}

/* affinities: horizontal rows beside diamond */
#affinities{flex:1;display:flex;flex-direction:column;gap:3px;justify-content:center;padding-left:0;transform:translate(-8px,4px);}
.aff-row{display:flex;gap:2px;justify-content:space-between;}
.aff-cell{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;}
.aff-cell .sym{
  font-size:6.5px;color:var(--ink-dim);text-transform:uppercase;
  line-height:1;margin-bottom:2px;font-weight:600;
}
.aff-cell .mark{
  width:100%;background:transparent;border:none;
  font-size:7.5px;font-weight:700;text-align:center;line-height:12px;height:13px;color:var(--ink);
}
.mark[data-v="-"]{color:var(--ink-faint);}

/* description: slot-column width, left, sits between the top row and slots */
#desctext{
  position:absolute;left:10px;top:150px;bottom:160px;width:295px;z-index:2;
  resize:none;
  background:rgba(8,8,8,.72);
  border:1px solid var(--line-soft);border-left:2px solid var(--line);
  color:var(--ink);font-family:'Cinzel',serif;font-size:10px;line-height:1.6;
  padding:9px 11px;outline:none;letter-spacing:.3px;text-align:justify;
}
#desctext::placeholder{color:var(--ink-faint);font-style:italic;}

/* ================= SLOTS ================= */
#slots{position:absolute;bottom:12px;left:10px;width:295px;z-index:3;}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.slot{
  display:flex;align-items:center;min-width:0;
  border:1px solid var(--line-soft);border-left:2px solid var(--line);
  background:rgba(8,8,8,.85);height:20px;
}
.slot input{
  flex:1;min-width:0;background:transparent;border:none;color:var(--ink);
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:.5px;padding:0 9px;outline:none;
}
.slot input::placeholder{color:var(--ink-faint);}

/* ================= controls ================= */
#controls{position:absolute;bottom:8px;right:10px;z-index:5;display:flex;align-items:center;gap:8px;}
#controls .btn{
  font-size:7.5px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase;
  cursor:pointer;border:1px solid var(--line-soft);padding:3px 8px;background:rgba(0,0,0,.6);
}
#controls .btn:hover{color:var(--ink);border-color:var(--line);}
#padwrap{
  display:flex;align-items:center;gap:5px;
  font-size:7.5px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase;
  background:rgba(0,0,0,.6);border:1px solid var(--line-soft);padding:2px 8px;
}
#padwrap input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:70px;height:3px;background:#444;border-radius:2px;outline:none;cursor:pointer;
}
#padwrap input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:8px;height:8px;border-radius:50%;background:#cfcfcf;border:1px solid #000;cursor:pointer;
}
#padwrap input[type=range]::-moz-range-thumb{
  width:8px;height:8px;border-radius:50%;background:#cfcfcf;border:1px solid #000;cursor:pointer;
}
#fileinput,#loadinput{display:none;}

.corner{position:absolute;width:12px;height:12px;z-index:4;border-color:var(--line);}
.corner.tl{top:0;left:0;border-top:1px solid;border-left:1px solid;}
.corner.tr{top:0;right:0;border-top:1px solid;border-right:1px solid;}
.corner.bl{bottom:0;left:0;border-bottom:1px solid;border-left:1px solid;}
.corner.br{bottom:0;right:0;border-bottom:1px solid;border-right:1px solid;}
</style>
</head>
<body>
<div id="stage">
  <div id="scaler">
    <div id="sheet">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>

      <div id="portrait" class="empty"></div>
      <div id="scrim"></div>

      <div id="header">
        <div class="hdr-bg"></div>
        <input id="name" placeholder="NAME" spellcheck="false">
        <input id="epithet" placeholder="nature" spellcheck="false">
        <div class="hdr-line"></div>
      </div>

      <div id="leftcol">
        <div id="toprow">
          <div id="natureblock">
            <svg id="diamond" viewBox="0 0 108 98"></svg>
          </div>

          <div id="affinities">
            <div class="aff-row" id="elemRow"></div>
            <div class="aff-row" id="ailRow"></div>
          </div>
        </div>
      </div>

      <textarea id="desctext" placeholder="Description..." spellcheck="false"></textarea>

      <div id="slots">
        <div class="slot-grid" id="slotGrid"></div>
      </div>

      <div id="controls">
        <div id="padwrap">
          <span>Pos</span>
          <input type="range" id="padrange" min="0" max="100" value="50">
        </div>
        <div class="btn" id="imgload">＋ Image</div>
        <div class="btn" id="savebtn">↧ Save</div>
        <div class="btn" id="loadbtn">↥ Load</div>
        <div class="btn" id="exportbtn">↧ PNG</div>
      </div>
      <input type="file" id="fileinput" accept="image/*">
      <input type="file" id="loadinput" accept="application/json,.json">
    </div>
  </div>
</div>

<script>
/* ---------- scale to fit ---------- */
function fit(){
  const s=Math.min(window.innerWidth/640, window.innerHeight/480);
  document.getElementById("scaler").style.transform="scale("+s+")";
}
window.addEventListener("resize",fit);fit();

/* ---------- affinities ---------- */
const ELEMENTS=["Agn","Aqu","Flr","Ter","Vnt","Vol","Scr","Prf","Arc"];
const AILMENTS=["Und","Stn","Bli","Hex","Str","Bld","Wth","Dsp","Fog"];
const STATES=["-","Wk","Str","Nul","Rpl","Drn"];

function buildAff(rowId,list){
  const row=document.getElementById(rowId);
  list.forEach(sym=>{
    const cell=document.createElement("div");cell.className="aff-cell";
    const s=document.createElement("div");s.className="sym";s.textContent=sym;
    const m=document.createElement("div");m.className="mark";m.dataset.v="-";m.textContent="–";
    cell.appendChild(s);cell.appendChild(m);
    const cyc=dir=>{let i=STATES.indexOf(m.dataset.v);i=(i+dir+STATES.length)%STATES.length;m.dataset.v=STATES[i];m.textContent=STATES[i]==="-"?"–":STATES[i];};
    cell.addEventListener("click",()=>cyc(1));
    cell.addEventListener("contextmenu",e=>{e.preventDefault();cyc(-1);});
    row.appendChild(cell);
  });
}
buildAff("elemRow",ELEMENTS);
buildAff("ailRow",AILMENTS);

/* ---------- diamond ---------- */
const AXES=[
  {key:"phys",label:"Ph",ang:-135}, // top-left
  {key:"soc", label:"Sc",ang:-45},  // top-right
  {key:"men", label:"Mt",ang:45},   // bottom-right
  {key:"spir",label:"Sp",ang:135},  // bottom-left
];
const CX=54,CY=49,RMAX=35,MAXV=3;
const svg=document.getElementById("diamond");
const NS="http://www.w3.org/2000/svg";
let traits={phys:2,soc:2,spir:2,men:2};

function pt(ang,r){const a=ang*Math.PI/180;return[CX+Math.cos(a)*r,CY+Math.sin(a)*r];}
function mk(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

function drawDiamond(){
  svg.innerHTML="";
  for(let v=1;v<=MAXV;v++){
    const r=RMAX*v/MAXV;
    const d=AXES.map((ax,i)=>{const[x,y]=pt(ax.ang,r);return(i===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ")+" Z";
    svg.appendChild(mk("path",{d,class:"ring"}));
  }
  AXES.forEach(ax=>{const[x,y]=pt(ax.ang,RMAX);svg.appendChild(mk("line",{x1:CX,y1:CY,x2:x,y2:y,class:"axis"}));});
  const fd=AXES.map((ax,i)=>{const[x,y]=pt(ax.ang,RMAX*traits[ax.key]/MAXV);return(i===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ")+" Z";
  svg.appendChild(mk("path",{d:fd,class:"fill"}));

  AXES.forEach(ax=>{
    // labels sit just outside each corner
    const[lx,ly]=pt(ax.ang,RMAX+3);
    let anchor="middle",dy="0.3em";
    if(ax.ang===-135){anchor="end";dy="-0.05em";}   // top-left
    if(ax.ang===-45){anchor="start";dy="-0.05em";}   // top-right
    if(ax.ang===45){anchor="start";dy="0.75em";}     // bottom-right
    if(ax.ang===135){anchor="end";dy="0.75em";}      // bottom-left
    const t=mk("text",{x:lx,y:ly,"text-anchor":anchor,dy,class:"axis-label"});t.textContent=ax.label;svg.appendChild(t);

    const[hx,hy]=pt(ax.ang,RMAX);
    const hit=mk("line",{x1:CX,y1:CY,x2:hx,y2:hy,class:"knob-hit","stroke-width":18,stroke:"transparent"});
    hit.addEventListener("click",e=>setFromEvent(ax,e));svg.appendChild(hit);

    const[kx,ky]=pt(ax.ang,RMAX*traits[ax.key]/MAXV||0.001);
    const ks=5; // knob side length
    const knob=mk("rect",{x:(kx-ks/2).toFixed(1),y:(ky-ks/2).toFixed(1),width:ks,height:ks,class:"knob",transform:`rotate(45 ${kx.toFixed(1)} ${ky.toFixed(1)})`});
    knob.addEventListener("mousedown",e=>startDrag(ax,e));
    knob.addEventListener("touchstart",e=>startDrag(ax,e),{passive:false});
    svg.appendChild(knob);
  });
}
function valueFromPoint(ax,clientX,clientY){
  const rect=svg.getBoundingClientRect();
  const sc=rect.width/108;
  const sx=(clientX-rect.left)/sc, sy=(clientY-rect.top)/sc;
  const a=ax.ang*Math.PI/180;
  const proj=(sx-CX)*Math.cos(a)+(sy-CY)*Math.sin(a);
  let v=Math.round(proj/RMAX*MAXV);
  return Math.max(0,Math.min(MAXV,v));
}
function setFromEvent(ax,e){traits[ax.key]=valueFromPoint(ax,e.clientX,e.clientY);drawDiamond();}
let dragAx=null;
function startDrag(ax,e){e.preventDefault();dragAx=ax;}
function moveDrag(e){if(!dragAx)return;const p=e.touches?e.touches[0]:e;traits[dragAx.key]=valueFromPoint(dragAx,p.clientX,p.clientY);drawDiamond();}
function endDrag(){dragAx=null;}
window.addEventListener("mousemove",moveDrag);
window.addEventListener("mouseup",endDrag);
window.addEventListener("touchmove",moveDrag,{passive:false});
window.addEventListener("touchend",endDrag);
drawDiamond();

/* ---------- slots ---------- */
const slotGrid=document.getElementById("slotGrid");
for(let i=1;i<=12;i++){
  const s=document.createElement("div");s.className="slot";
  s.innerHTML=`<input placeholder="—" spellcheck="false">`;
  slotGrid.appendChild(s);
}

/* ---------- image + position ---------- */
const portrait=document.getElementById("portrait");
const fileinput=document.getElementById("fileinput");
let portraitData=null; // raw data URL, so it can be saved
document.getElementById("imgload").addEventListener("click",()=>fileinput.click());
fileinput.addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    portraitData=ev.target.result;
    portrait.style.backgroundImage=`url("${portraitData}")`;
    portrait.classList.remove("empty");
    applyPos();
  };
  r.readAsDataURL(f);
});
const padrange=document.getElementById("padrange");
function applyPos(){ portrait.style.backgroundPosition = padrange.value+"% center"; }
padrange.addEventListener("input",applyPos);

/* ---------- Save / Load state to a small JSON file ---------- */
document.getElementById("savebtn").addEventListener("click",saveState);
document.getElementById("loadbtn").addEventListener("click",()=>document.getElementById("loadinput").click());
document.getElementById("loadinput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{ try{ applyState(JSON.parse(ev.target.result)); }catch(err){ alert("Couldn't read that file — it may not be a valid sheet save."); } };
  r.readAsText(f);
  e.target.value=""; // allow re-loading the same file
});

function collectState(){
  const marks={};
  document.querySelectorAll("#elemRow .aff-cell, #ailRow .aff-cell").forEach((cell,i)=>{
    const row=cell.closest("#elemRow")?"e":"a";
    const idx=[...cell.parentNode.children].indexOf(cell);
    marks[row+idx]=cell.querySelector(".mark").dataset.v;
  });
  const slots=[...document.querySelectorAll("#slotGrid input")].map(el=>el.value);
  return {
    name:document.getElementById("name").value,
    epithet:document.getElementById("epithet").value,
    desc:document.getElementById("desctext").value,
    traits:{...traits},
    marks,
    slots,
    pos:padrange.value,
    portrait:portraitData
  };
}
function saveState(){
  const data=collectState();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  const nm=(data.name||"npc").trim().replace(/\s+/g,"_").toLowerCase();
  a.download=nm+".sheet.json";
  a.href=URL.createObjectURL(blob);
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function applyState(d){
  document.getElementById("name").value=d.name||"";
  document.getElementById("epithet").value=d.epithet||"";
  document.getElementById("desctext").value=d.desc||"";
  if(d.traits){ Object.assign(traits,d.traits); drawDiamond(); }
  if(d.marks){
    const rows={e:document.getElementById("elemRow"),a:document.getElementById("ailRow")};
    Object.entries(d.marks).forEach(([k,v])=>{
      const row=rows[k[0]]; const idx=parseInt(k.slice(1),10);
      const cell=row&&row.children[idx];
      if(cell){ const m=cell.querySelector(".mark"); m.dataset.v=v; m.textContent = v==="-"?"–":v; }
    });
  }
  if(Array.isArray(d.slots)){
    const inputs=document.querySelectorAll("#slotGrid input");
    d.slots.forEach((val,i)=>{ if(inputs[i]) inputs[i].value=val; });
  }
  if(d.pos!=null){ padrange.value=d.pos; }
  if(d.portrait){
    portraitData=d.portrait;
    portrait.style.backgroundImage=`url("${d.portrait}")`;
    portrait.classList.remove("empty");
  }
  applyPos();
}

/* ---------- export to 640x480 PNG (controls hidden) ---------- */
document.getElementById("exportbtn").addEventListener("click",exportPNG);

// cache for the embedded @font-face CSS, read once from the page's own stylesheets
let _fontCSS=null;
function getFontCSS(){
  if(_fontCSS!==null) return _fontCSS;
  _fontCSS="";
  try{
    for(const sheet of document.styleSheets){
      let rules;
      try{ rules=sheet.cssRules; }catch(e){ continue; } // cross-origin sheets throw
      if(!rules) continue;
      for(const rule of rules){
        if(rule.type===CSSRule.FONT_FACE_RULE){ _fontCSS+=rule.cssText; }
      }
    }
  }catch(err){
    console.warn("Couldn't read embedded font for export.",err);
    _fontCSS="";
  }
  return _fontCSS;
}

function exportPNG(){
  const sheet=document.getElementById("sheet");
  const controls=document.getElementById("controls");
  const prevDisplay=controls.style.display;
  controls.style.display="none"; // hide Pos + Image in the capture

  // clone the sheet and inline computed styles so the serialized copy renders standalone
  const clone=sheet.cloneNode(true);
  inlineStyles(sheet,clone);
  controls.style.display=prevDisplay; // restore live UI immediately

  // mirror input/textarea values into the clone as static text
  const liveFields=sheet.querySelectorAll("input,textarea");
  const cloneFields=clone.querySelectorAll("input,textarea");
  liveFields.forEach((el,i)=>{
    const c=cloneFields[i];
    if(!c) return;
    if(el.value){ c.setAttribute("value",el.value); c.textContent=el.value; }
    else { c.setAttribute("placeholder",el.getAttribute("placeholder")||""); }
  });

  const fontCSS=getFontCSS();

  const W=640,H=480,SCALE=2;
  const xml=new XMLSerializer().serializeToString(clone);
  const styleTag=fontCSS ? '<style>'+fontCSS+'</style>' : '';
  const svg=
    '<svg xmlns="http://www.w3.org/2000/svg" width="'+(W*SCALE)+'" height="'+(H*SCALE)+'" viewBox="0 0 '+W+' '+H+'">'+
      styleTag+
      '<foreignObject width="'+W+'" height="'+H+'">'+
        '<div xmlns="http://www.w3.org/1999/xhtml" style="font-family:\'Cinzel\',serif">'+xml+'</div>'+
      '</foreignObject>'+
    '</svg>';

  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement("canvas");
    canvas.width=W*SCALE;canvas.height=H*SCALE;
    const ctx=canvas.getContext("2d");
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
    ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    canvas.toBlob(blob=>{
      const a=document.createElement("a");
      const nm=(document.getElementById("name").value||"npc").trim().replace(/\s+/g,"_").toLowerCase();
      a.download=nm+".png";
      a.href=URL.createObjectURL(blob);
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    },"image/png");
  };
  img.onerror=()=>alert("Export failed to render. If the portrait was loaded from a file it should still work; try re-adding the image.");
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

// copy computed styles from source tree onto the cloned tree, node by node
function inlineStyles(src,dst){
  const cs=getComputedStyle(src);
  let str="";
  for(let i=0;i<cs.length;i++){const p=cs[i];str+=p+":"+cs.getPropertyValue(p)+";";}
  dst.setAttribute("style",str);
  // pseudo-elements (::after / ::before) can't be cloned; the scrim + panel are real elements so they carry over
  const s=src.children, d=dst.children;
  for(let i=0;i<s.length;i++){ if(d[i]) inlineStyles(s[i],d[i]); }
}
</script>
</body>
</html>
